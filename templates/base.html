<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}PizIA{% endblock %} · Pizzería</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>
:root{--ink:#20211e;--tomato:#e4572e;--cream:#fffaf3;--leaf:#648a48}body{background:var(--cream);color:var(--ink);font-family:system-ui,sans-serif}.navbar{background:#20211e}.navbar-brand{font-weight:800;letter-spacing:.03em}.navbar-brand span{color:#ffb36b}.hero{background:#20211e;color:white;border-radius:1.5rem;padding:3rem;background-image:radial-gradient(circle at 90% 10%,#e4572e77,transparent 33%)}.eyebrow{color:#ffb36b;text-transform:uppercase;font-size:.78rem;letter-spacing:.16em;font-weight:700}.card{border:1px solid #eee4d8;border-radius:1rem;box-shadow:0 8px 24px #34291a0b}.btn-primary{background:var(--tomato);border-color:var(--tomato)}.btn-primary:hover{background:#c84423;border-color:#c84423}.nav-link{color:#f5f0e8!important}.text-secondary{color:#716f69!important}footer{color:#716f69}
</style></head><body><nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand" href="{% url 'inicio' %}">🍕 Piz<span>IA</span></a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div id="nav" class="collapse navbar-collapse"><div class="navbar-nav ms-auto"><a class="nav-link" href="{% url 'inicio' %}">Inicio</a><a class="nav-link" href="{% url 'lista_pizzas' %}">Menú</a><a class="nav-link" href="{% url 'crear_pedido' %}">Nuevo pedido</a><a class="nav-link" href="{% url 'lista_pedidos' %}">Pedidos</a><a class="nav-link" href="{% url 'recomendar' %}">PizIA recomienda</a><a class="nav-link" href="{% url 'lista_clientes' %}">Clientes</a><a class="nav-link" href="{% url 'lista_ingredientes' %}">Ingredientes</a><a class="nav-link" href="/admin/">Admin</a></div></div></div></nav>
<main class="container py-4">{% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main><footer class="container py-5 text-center">PizIA · Proyecto formativo ADSO · Colombia</footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
