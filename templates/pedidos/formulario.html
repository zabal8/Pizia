{% extends 'base.html' %}{% block title %}Nuevo pedido{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card p-4"><div class="eyebrow">Pedido en línea</div><h1 class="h2">Elige tu pizza</h1><p class="text-secondary">Deja tus datos y registraremos tu pedido.</p><form method="post">{% csrf_token %}<label class="form-label" for="nombre">Nombre</label><input required minlength="3" class="form-control mb-3" id="nombre" name="nombre" autocomplete="name"><label class="form-label" for="email">Correo electrónico</label><input required type="email" class="form-control mb-3" id="email" name="email" autocomplete="email"><label class="form-label" for="pizza">Pizza</label><select required class="form-select mb-4" id="pizza" name="pizza"><option value="">Selecciona una pizza</option>{% for p in pizzas %}<option value="{{ p.pk }}">{{ p.nombre }} · ${{ p.precio }}</option>{% endfor %}</select><button class="btn btn-primary btn-lg">Confirmar pedido</button></form>{% if not pizzas %}<p class="alert alert-warning mt-3">El menú está vacío. Vuelve pronto.</p>{% endif %}</div></div></div>{% endblock %}
